spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# External API client used to fetch book metadata (see GoogleBooksClient)
google.books.api.url=https://www.googleapis.com/books/v1/volumes
google.books.api.connect-timeout-ms=3000
google.books.api.read-timeout-ms=5000
